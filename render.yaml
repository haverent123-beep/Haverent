services:
  - type: web
    name: haverent-api
    runtime: node
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: PAYMENT_UPI_ID
        value: 9553473078-4@ybl
